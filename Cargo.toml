[package]
name = "scuttle-db"
version = "0.1.0"
edition = "2024"
authors = ["Douglas Rocha"]
description = "A learning project: building a relational database from scratch in Rust"
readme = "README.md"
license = "MIT"
keywords = ["database", "sql", "learning"]
categories = ["database-implementations", "development-tools"]

[dependencies]
miette = "7.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2.0.18"

# Terminal-only error rendering; left out of the WebAssembly build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
miette = { version = "7.6.0", features = ["fancy"] }

[workspace]
members = ["scuttle-wasm"]

[[bin]]
name = "test-repl"
path = "src/bin/test-repl.rs"

[[bin]]
name = "scuttle-db"
path = "src/bin/scuttle.rs"
