[package]
name = "scuttle-wasm"
version = "0.1.0"
edition = "2024"
authors = ["Douglas Rocha"]
description = "Scuttle DB compiled to WebAssembly for running in the browser"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
scuttle-db = { path = ".." }
serde_json = "1.0.149"
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
